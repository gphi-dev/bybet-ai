services:
  backend:
    build:
      context: ./2-chatbot-service
    env_file:
      - ./2-chatbot-service/.env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./chat-widget/dist:/usr/share/nginx/widget:ro
    restart: unless-stopped
