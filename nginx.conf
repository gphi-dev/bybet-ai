events {}

http {
    include mime.types;
    # Per-IP API rate limit: 20 requests/minute, tracked by client IP.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;

    server {
        listen 80 default_server;
        server_name _; # Raw IP / default host (no domain yet)

        # SSL placeholder:
        # Add a second server block for listen 443 ssl and certificates later.

        location /api/ {
            # Enforce API throttling at the edge before requests hit Node.
            # Allow short spikes of up to 5 extra requests, then reject with 429.
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:4001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /widget {
            return 301 /widget/;
        }

        location /widget/ {
            alias /usr/share/nginx/widget/;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
